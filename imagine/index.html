<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagine — Vrushtee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="/assets/sky.js?v=5"></script>
    <style>
        :root {
            --deep-red: #8B0000;
            --medium-red: #C41E3A;
            --warm-yellow: #FFB000;
            --light-cream: #FFF9F0;
            --peach: #FFFFFF;
            --text-dark: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--peach);
            color: var(--text-dark);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        header {
            padding: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Crimson Pro', serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--deep-red);
            text-decoration: none;
        }

        .header-nav {
            display: flex;
            gap: 32px;
        }

        .header-nav a {
            font-size: 15px;
            font-weight: 400;
            text-decoration: none;
            color: var(--text-dark);
            position: relative;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .header-nav a.active {
            color: var(--deep-red);
        }

        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--deep-red), var(--warm-yellow));
            transition: width 0.3s ease;
        }

        .header-nav a:hover::after,
        .header-nav a.active::after {
            width: 100%;
        }

        .header-social {
            display: flex;
            gap: 20px;
        }

        .header-social a {
            font-size: 14px;
            color: var(--medium-red);
            text-decoration: none;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        .header-social a:hover {
            color: var(--deep-red);
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 32px 80px;
            position: relative;
        }

        .page-title {
            font-family: 'Crimson Pro', serif;
            font-size: 64px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--deep-red) 0%, var(--medium-red) 50%, var(--warm-yellow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeInUp 1s ease forwards;
        }

        .page-subtitle {
            font-size: 18px;
            color: var(--medium-red);
            font-weight: 300;
            margin-bottom: 64px;
            opacity: 0;
            animation: fadeInUp 1s ease 0.2s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .accent-line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--deep-red), var(--warm-yellow));
            margin-bottom: 48px;
            opacity: 0;
            animation: expandWidth 1.5s ease 0.4s forwards;
        }

        @keyframes expandWidth {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 80px;
                opacity: 1;
            }
        }

        .content {
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        .content p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .content strong {
            color: var(--deep-red);
            font-weight: 500;
        }

        @media (max-width: 640px) {
            header {
                flex-direction: column;
                gap: 24px;
                padding: 24px;
            }

            .header-nav {
                gap: 24px;
            }

            .container {
                padding: 32px 24px 60px;
            }

            .page-title {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Vrushtee</a>
        <nav class="header-nav">
            <a href="/wonder/">Wonder</a>
            <a href="/work/">Work</a>
            <a href="/imagine/" class="active">Imagine</a>
        </nav>
        <div class="header-social">
            <a href="https://github.com/vruga" target="_blank" rel="noopener">GitHub</a>
            <a href="https://x.com/vruga_" target="_blank" rel="noopener">X</a>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Imagine</h1>
        <p class="page-subtitle">Ideas waiting to exist</p>

        <div class="accent-line"></div>

        <div class="content">
        </div>
    </div>

</body>
</html>
